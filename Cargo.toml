[package]
name = "g3-native-plugins"
version = "0.4.5"

edition = "2024"
description = "Dioxus plugins for mobile permissions, auth, storage, purchases, media, notifications, self-updates, deep links, and platform integration."
repository = "https://github.com/g3techhq/g3-native-plugins"
readme = "README.md"
documentation = "https://docs.rs/g3-native-plugins"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "mobile", "plugins", "ios", "android"]
categories = ["api-bindings", "gui", "wasm"]
include = ["Cargo.toml", "build.rs", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**"]

[package.metadata.docs.rs]
# Every plugin, documented as an app on a phone sees it: most plugins have no
# API on docs.rs's default Linux target, where they would not show up at all.
all-features = true
default-target = "aarch64-linux-android"
targets = ["aarch64-linux-android", "aarch64-apple-ios", "wasm32-unknown-unknown"]

[lib]
name = "g3_native_plugins"
path = "src/lib.rs"

[dependencies]
manganis = "=0.8.0-alpha.3"
cfg-if = "1.0.0"
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = ["macro", "hooks"] }
dioxus-signals = "=0.8.0-alpha.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The updater's verification: pure Rust with no C to cross-compile, so the
# Android and iOS checks need nothing beyond the Rust target. minisign-verify is
# what Tauri's updater verifies with, which keeps its signing tooling usable.
minisign-verify = { version = "0.2.5", optional = true }
semver = { version = "1.0", optional = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location", "Navigator", "Storage", "Window"] }

[target.'cfg(target_os="android")'.dependencies]
# The fork's manganis hands `with_activity` callers its own `JNIEnv`, built
# against jni 0.21.1; asking for at least that keeps the two one crate.
jni = "0.21.1"
ndk-context = "0.1.1"

# The desktop updater fetches with its own client, since there is no platform
# one to call. ring rather than aws-lc-rs, so Windows needs no CMake or NASM,
# and the OS verifier rather than webpki-roots, so a machine's own trusted
# certificates (a home lab's CA) work. The archives are the ones `dx bundle`
# writes for updates: `.zip` around a Windows installer, `.tar.gz` otherwise.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4.44", optional = true, default-features = false }
ureq = { version = "3.1", optional = true, default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
# "deflate" rather than "deflate-flate2", which in 2.x forgets to turn on flate2.
zip = { version = "2.4", optional = true, default-features = false, features = ["deflate"] }

# The desktop clipboard: every target build.rs calls `desktop`. Text only, so
# none of its image support and the image crates that come with it.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.6", optional = true, default-features = false }

# Windows' share sheet, through WinRT. 0.62 is the version wry and tao bring.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dev-dependencies]
# The share sheet test makes a window of its own to share from.
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[features]
default = []
app-info = []
appearance = []
back-button = []
deep-links = []
clipboard = ["dep:arboard", "dep:windows"]
auth = []
camera-microphone = []
external-url = []
geolocation = []
in-app-purchases = []
media = []
notifications = []
# Remote push rides on the local plugin: the permission a push needs to be seen
# is the notification permission, and there is one place to ask for it.
push-notifications = ["notifications"]
# Started by NativePluginsProvider: an app enabling it needs no code.
safe-area = []
storage = []
updater = ["dep:minisign-verify", "dep:semver", "dep:flate2", "dep:tar", "dep:ureq", "dep:zip"]
# Android: install a downloaded APK. Adds REQUEST_INSTALL_PACKAGES, which Google
# Play restricts, so a Play build leaves it off and updates through its store
# page. No effect elsewhere: desktop always installs, iOS never can.
updater-install = ["updater"]

[patch.crates-io]
# Dioxus fork (upstream main + g3 commits; see G3-PATCHES.md there). Local
# builds use the sibling checkouts via Projects/.cargo/config.toml.
dioxus = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-signals = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
manganis = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }

[lints.clippy]
cloned_instead_of_copied = "warn"
allow_attributes_without_reason = "warn"
