[package]
name = "g3-native-plugins"
version = "0.3.0"

edition = "2024"
description = "Dioxus plugins for mobile permissions, auth, storage, purchases, media, deep links, and platform integration."
repository = "https://github.com/g3techhq/g3-native-plugins"
readme = "README.md"
documentation = "https://docs.rs/g3-native-plugins"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "mobile", "plugins", "ios", "android"]
categories = ["api-bindings", "gui", "wasm"]
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**"]

[lib]
name = "g3_native_plugins"
path = "src/lib.rs"

[dependencies]
manganis = "=0.7.9"
cfg-if = "1.0.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "hooks"] }
dioxus-signals = "=0.7.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch="wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location", "Navigator", "Storage", "Window"] }

[target.'cfg(target_os="android")'.dependencies]
jni = "0.21.0"
ndk-context = "0.1.1"

[features]
default = []
back-button = []
deep-links = []
clipboard = []
auth = []
camera-microphone = []
external-url = []
geolocation = []
in-app-purchases = []
media = []
storage = []
