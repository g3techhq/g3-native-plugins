[package]
name = "g3-native-plugins-testbed"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone rather than a member of the library's package, so `cargo test` and
# `cargo package` at the repo root neither build nor ship the test bed.
[workspace]

[dependencies]
dioxus = { version = "=0.8.0-alpha.3", features = [] }
g3-native-plugins = { path = "..", features = [
    "app-info",
    "auth",
    "back-button",
    "camera-microphone",
    "clipboard",
    "deep-links",
    "external-url",
    "geolocation",
    "in-app-purchases",
    "media",
    "notifications",
    "push-notifications",
    "storage",
    "updater",
] }

[features]
default = ["mobile"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

# The test bed is its own workspace root, so it needs its own patch: the
# library's does not apply when Cargo resolves from here.
[patch.crates-io]
# Dioxus fork (upstream main + g3 commits; see G3-PATCHES.md there). Local
# builds use the sibling checkouts via Projects/.cargo/config.toml.
dioxus = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-signals = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
manganis = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
