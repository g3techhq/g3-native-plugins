name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    uses: g3techhq/.github/.github/workflows/rust-quality.yml@da47dc747376edcf6ecc0cc986aec51f5084bf42 # v1.0.0

  android:
    name: Android facade and packaged testbed
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
          components: clippy
      - name: Check Android target
        run: cargo check --target aarch64-linux-android --all-features
      - name: Lint Android testbed
        run: cargo clippy --manifest-path testbed/Cargo.toml --target aarch64-linux-android --all-targets --no-deps -- -D warnings
      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Dioxus CLI
        # The fork's CLI, to match the fork's Dioxus: dx and the dioxus crates
        # must come from the same source.
        run: cargo install --git https://github.com/Gateway3B/dioxus --branch main dioxus-cli --locked
      - name: Build Android testbed including Kotlin plugins
        working-directory: testbed
        run: dx build --android --target aarch64-linux-android --fullstack false

  apple:
    name: Apple facade and packaged testbed
    # The apps build their store bundles with Xcode 26 (App Store Connect
    # refuses older SDKs), so the Swift here is checked with the same one.
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          [[ "$major" -ge 26 ]] || {
            echo "The apps ship with Xcode 26 or newer; this runner selects Xcode $major" >&2
            exit 1
          }
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
          components: clippy
      - name: Check macOS target
        run: cargo check --all-features
      - name: Check iOS Simulator target
        run: cargo check --target aarch64-apple-ios-sim --all-features
      - name: Lint the iOS target
        # The Swift bindings are compiled only for iOS, so no other job lints
        # them. Same as `just check-ios`.
        run: |
          cargo clippy --target aarch64-apple-ios --all-features --no-deps -- -D warnings
          cargo clippy --target aarch64-apple-ios --no-deps --features "appearance back-button clipboard external-url media storage" -- -D warnings
      - name: Swift framework holds only the enabled plugins
        # ITMS-90683: a framework referencing a permission API the app does not
        # use is rejected. Builds the package as dx does for two feature sets.
        run: |
          scripts/check-swift-subset.sh
          scripts/check-swift-subset.sh Auth InAppPurchases PushNotifications Storage
      - name: Lint iOS Simulator testbed
        run: cargo clippy --manifest-path testbed/Cargo.toml --target aarch64-apple-ios-sim --all-targets --no-deps -- -D warnings
      - name: Install Dioxus CLI
        # The fork's CLI, to match the fork's Dioxus: dx and the dioxus crates
        # must come from the same source.
        run: cargo install --git https://github.com/Gateway3B/dioxus --branch main dioxus-cli --locked
      - name: Build iOS Simulator testbed including Swift plugins
        working-directory: testbed
        run: dx build --ios --target aarch64-apple-ios-sim --fullstack false --codesign false
