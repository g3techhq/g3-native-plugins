name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    uses: g3techhq/.github/.github/workflows/rust-quality.yml@da47dc747376edcf6ecc0cc986aec51f5084bf42 # v1.0.0

  android:
    name: Android facade and packaged testbed
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
          components: clippy
      - name: Check Android target
        run: cargo check --target aarch64-linux-android --all-features
      - name: Lint Android testbed
        run: cargo clippy --manifest-path testbed/Cargo.toml --target aarch64-linux-android --all-targets --no-deps -- -D warnings
      - name: Install Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Dioxus CLI
        # The fork's CLI, to match the fork's Dioxus: dx and the dioxus crates
        # must come from the same source.
        run: cargo install --git https://github.com/Gateway3B/dioxus --branch main dioxus-cli --locked
      - name: Build Android testbed including Kotlin plugins
        working-directory: testbed
        run: dx build --android --target aarch64-linux-android --fullstack false

  apple:
    name: Apple facade and packaged testbed
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-ios-sim
          components: clippy
      - name: Check macOS target
        run: cargo check --all-features
      - name: Check iOS Simulator target
        run: cargo check --target aarch64-apple-ios-sim --all-features
      - name: Lint iOS Simulator testbed
        run: cargo clippy --manifest-path testbed/Cargo.toml --target aarch64-apple-ios-sim --all-targets --no-deps -- -D warnings
      - name: Install Dioxus CLI
        # The fork's CLI, to match the fork's Dioxus: dx and the dioxus crates
        # must come from the same source.
        run: cargo install --git https://github.com/Gateway3B/dioxus --branch main dioxus-cli --locked
      - name: Build iOS Simulator testbed including Swift plugins
        working-directory: testbed
        run: dx build --ios --target aarch64-apple-ios-sim --fullstack false --codesign false
