name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks and tests
    runs-on: [self-hosted, linux, g3-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check default build
        run: cargo check

      - name: Check all feature build
        run: cargo check --features clipboard,auth,external-url

      - name: Run feature tests
        run: cargo test --features clipboard,auth,external-url

      - name: Check whitespace
        run: git diff --check